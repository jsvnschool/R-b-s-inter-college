<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rambax Singh Inter College - Admin Portal</title>
  <style>
    /* Global Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
    }

    /* Header & School Photo Banner Section */
    .header-banner {
      position: relative;
      background: linear-gradient(rgba(15, 32, 67, 0.75), rgba(15, 32, 67, 0.75)), 
                  url('school-photo.jpg') center/cover no-repeat; /* Yahan school photo ka link dalein */
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .header-banner h1 {
      font-size: 2.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    /* Main Container Layout */
    .main-container {
      max-width: 1100px;
      margin: -40px auto 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
      position: relative;
      z-index: 10;
    }

    /* Manager Profile Section */
    .manager-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border-top: 5px solid #1a365d;
    }

    .manager-img-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 15px auto;
    }

    .manager-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #1a365d;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    .manager-card h3 {
      font-size: 1.25rem;
      color: #1a365d;
      margin-bottom: 5px;
    }

    .manager-card p {
      font-size: 0.9rem;
      color: #666;
      font-weight: 600;
    }

    /* Login Panel / Form Section */
    .login-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 35px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .login-card h2 {
      font-size: 1.6rem;
      color: #1a365d;
      margin-bottom: 20px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #4a5568;
    }

    /* Confidential Info Badge */
    .confidential-badge {
      display: inline-block;
      background-color: #edf2f7;
      color: #718096;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-style: italic;
    }

    /* Password Input with Show/Hide Toggle */
    .password-field-wrapper {
      position: relative;
    }

    .form-control {
      width: 100%;
      padding: 12px 45px 12px 15px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #2b6cb0;
    }

    .toggle-password-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1.2rem;
      user-select: none;
      color: #718096;
    }

    .submit-btn {
      width: 100%;
      background-color: #1a365d;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #2b6cb0;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
        margin-top: 20px;
      }
      
      .header-banner h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Header with School Photos Overlay -->
  <header class="header-banner">
    <h1>Rambax Singh Inter College</h1>
  </header>

  <!-- Main Content Layout -->
  <div class="main-container">
    
    <!-- 2. Manager Profile Card -->
    <aside class="manager-card">
      <div class="manager-img-wrapper">
        <!-- Manager photo link badlein -->
        <img src="manager-photo.jpg" alt="Manager Photo" class="manager-img">
      </div>
      <h3>Manager Name</h3>
      <p>Management / Administration</p>
    </aside>

    <!-- 3 & 4. Admin Portal Form (Hidden Admin ID & Password Toggle) -->
    <main class="login-card">
      <h2>Admin Security Portal</h2>

      <form id="adminLoginForm" onsubmit="handleLogin(event)">
        
        <!-- ADMIN ID: Fully Hidden from UI / Confidential -->
        <input type="hidden" id="adminId" name="admin_id" value="CONFIDENTIAL_ADMIN_ID">

        <div class="form-group">
          <label>Admin Identification Status</label>
          <div class="confidential-badge">
            🔒 Admin ID Verified & Encrypted (Hidden)
          </div>
        </div>

        <!-- Password Field with Show/Hide Toggle -->
        <div class="form-group">
          <label for="passwordInput">Enter Password</label>
          <div class="password-field-wrapper">
            <input 
              type="password" 
              id="passwordInput" 
              class="form-control" 
              placeholder="••••••••" 
              required
            >
            <span 
              class="toggle-password-btn" 
              id="toggleIcon" 
              onclick="togglePasswordVisibility()" 
              title="Show/Hide Password">
              👁️
            </span>
          </div>
        </div>

        <button type="submit" class="submit-btn">Login to Dashboard</button>
      </form>
    </main>

  </div>

  <script>
    // Password Show / Hide Functionality
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleIcon = document.getElementById('toggleIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.textContent = '🙈'; // Hide Icon
      } else {
        passwordInput.type = 'password';
        toggleIcon.textContent = '👁️'; // Show Icon
      }
    }

    // Login Form Submission Handling Example
    function handleLogin(event) {
      event.preventDefault();
      const password = document.getElementById('passwordInput').value;
      const hiddenAdminId = document.getElementById('adminId').value;

      alert("Form submitted successfully!\nAdmin ID (Confidential): " + hiddenAdminId);
    }
  </script>

</body>
</html>
